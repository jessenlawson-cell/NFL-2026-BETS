[build-system]
requires = ["setuptools==82.0.1", "wheel==0.46.3"]
build-backend = "setuptools.build_meta"

[project]
name = "nfl-2026-bets"
version = "0.1.0"
description = "Leakage-safe NFL quantitative betting research and paper-trading system."
requires-python = ">=3.13,<3.14"
dynamic = ["dependencies"]

[project.scripts]
nfl-bets = "nfl_bets.cli:app"

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.13"
strict = true
packages = ["nfl_bets"]
mypy_path = "src"
ignore_missing_imports = true

